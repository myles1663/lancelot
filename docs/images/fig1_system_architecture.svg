<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#3b4252"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #101828; }
      .subtitle { font-size: 12px; fill: #667085; }
      .section { font-size: 14px; font-weight: 700; fill: #101828; }
      .label { font-size: 11px; fill: #344054; }
      .small { font-size: 10px; fill: #667085; }
      .box { rx: 10; stroke-width: 2; }
      .line { stroke: #3b4252; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #667085; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="860" fill="#f8fafc"/>

  <text x="600" y="34" text-anchor="middle" class="title">Figure 1: Lancelot Runtime Architecture</text>
  <text x="600" y="55" text-anchor="middle" class="subtitle">Operator control, governed execution, durable memory, receipts, and runtime-toggleable subsystems</text>

  <!-- Operator surface -->
  <rect x="55" y="90" width="1090" height="82" class="box" fill="#111827" stroke="#334155"/>
  <text x="600" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">WAR ROOM + OPERATOR CHANNELS</text>
  <text x="600" y="145" text-anchor="middle" font-size="11" fill="#cbd5e1">Command Center | Governance | Receipts | Memory | Health | Kill Switches | HIVE | Federation | Setup &amp; Recovery</text>
  <text x="600" y="160" text-anchor="middle" font-size="10" fill="#94a3b8">War Room, Telegram, REST API, scheduled jobs, and federated operator workflows enter through the same governed runtime boundary.</text>

  <!-- Core runtime -->
  <rect x="380" y="225" width="440" height="170" class="box" fill="#eef4ff" stroke="#2e5aac"/>
  <text x="600" y="252" text-anchor="middle" class="section">CORE RUNTIME</text>
  <line x1="415" y1="267" x2="785" y2="267" stroke="#2e5aac" stroke-width="1"/>
  <text x="600" y="292" text-anchor="middle" class="label">Gateway API, auth, rate limits, input safety, and prompt-injection screening</text>
  <text x="600" y="316" text-anchor="middle" class="label">Orchestrator, intent routing, async command runs, progress events, and cancellation</text>
  <text x="600" y="340" text-anchor="middle" class="label">Model Router: local utility/redaction, flagship fast, flagship deep, cache lanes</text>
  <text x="600" y="364" text-anchor="middle" class="label">Control Plane: pause, emergency stop, feature flags, and runtime hot toggles</text>

  <!-- Governance plane -->
  <rect x="55" y="225" width="275" height="255" class="box" fill="#fff7ed" stroke="#c2410c"/>
  <text x="192" y="252" text-anchor="middle" class="section">GOVERNANCE PLANE</text>
  <line x1="85" y1="267" x2="300" y2="267" stroke="#c2410c" stroke-width="1"/>
  <text x="192" y="294" text-anchor="middle" class="label">Soul constitution and policy ceilings</text>
  <text x="192" y="322" text-anchor="middle" class="label">Risk tiers T0-T3 and approval gates</text>
  <text x="192" y="350" text-anchor="middle" class="label">Trust Ledger graduation and revocation</text>
  <text x="192" y="378" text-anchor="middle" class="label">APL governed automation proposals</text>
  <text x="192" y="406" text-anchor="middle" class="label">Receipt service and integrity chain</text>
  <text x="192" y="434" text-anchor="middle" class="label">Network allowlist and security policies</text>
  <text x="192" y="462" text-anchor="middle" class="small">Governance runs before execution and records outcomes after execution.</text>

  <!-- Execution plane -->
  <rect x="870" y="225" width="275" height="255" class="box" fill="#f0fdf4" stroke="#15803d"/>
  <text x="1007" y="252" text-anchor="middle" class="section">EXECUTION PLANE</text>
  <line x1="900" y1="267" x2="1115" y2="267" stroke="#15803d" stroke-width="1"/>
  <text x="1007" y="294" text-anchor="middle" class="label">Tool Fabric and UAB bridge</text>
  <text x="1007" y="322" text-anchor="middle" class="label">MCP governance and server kill switches</text>
  <text x="1007" y="350" text-anchor="middle" class="label">A2A protocol and task-run ingress</text>
  <text x="1007" y="378" text-anchor="middle" class="label">HIVE Agent Mesh for bounded sub-agents</text>
  <text x="1007" y="406" text-anchor="middle" class="label">Scheduler and governed recurring jobs</text>
  <text x="1007" y="434" text-anchor="middle" class="label">Connectors with vault-backed credentials</text>
  <text x="1007" y="462" text-anchor="middle" class="small">Tools execute only through capability checks, policy, and receipts.</text>

  <!-- Memory plane -->
  <rect x="180" y="545" width="395" height="170" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="377" y="572" text-anchor="middle" class="section">MEMORY + CONTEXT PLANE</text>
  <line x1="215" y1="587" x2="540" y2="587" stroke="#7c3aed" stroke-width="1"/>
  <text x="377" y="612" text-anchor="middle" class="label">Core blocks, working memory, episodic memory, archival memory</text>
  <text x="377" y="636" text-anchor="middle" class="label">Enterprise session briefs, task experience, and repeat-work templates</text>
  <text x="377" y="660" text-anchor="middle" class="label">Quarantine, memory ethics, prompt-injection filtering, rollback receipts</text>
  <text x="377" y="684" text-anchor="middle" class="label">Context Efficiency: token budget, retrieval hits, compaction savings</text>

  <!-- Federation plane -->
  <rect x="625" y="545" width="395" height="170" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="822" y="572" text-anchor="middle" class="section">FEDERATION + OBSERVABILITY</text>
  <line x1="660" y1="587" x2="985" y2="587" stroke="#0891b2" stroke-width="1"/>
  <text x="822" y="612" text-anchor="middle" class="label">Federation overview, peer identity, heartbeats, and signed peer detail</text>
  <text x="822" y="636" text-anchor="middle" class="label">Fleet dashboard, unified approval queue, remote health, and budgets</text>
  <text x="822" y="660" text-anchor="middle" class="label">Health monitor, degradation reasons, readiness endpoints, update checks</text>
  <text x="822" y="684" text-anchor="middle" class="label">Receipts, runtime events, audit logs, and operator troubleshooting surfaces</text>

  <!-- Runtime toggles -->
  <rect x="55" y="545" width="90" height="170" class="box" fill="#1f2937" stroke="#475569"/>
  <text x="100" y="575" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">HOT</text>
  <text x="100" y="593" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">TOGGLES</text>
  <line x1="72" y1="608" x2="128" y2="608" stroke="#64748b"/>
  <text x="100" y="632" text-anchor="middle" font-size="9" fill="#cbd5e1">Feature flags</text>
  <text x="100" y="650" text-anchor="middle" font-size="9" fill="#cbd5e1">Kill switches</text>
  <text x="100" y="668" text-anchor="middle" font-size="9" fill="#cbd5e1">Pause runtime</text>
  <text x="100" y="686" text-anchor="middle" font-size="9" fill="#cbd5e1">Emergency stop</text>

  <rect x="1055" y="545" width="90" height="170" class="box" fill="#1f2937" stroke="#475569"/>
  <text x="1100" y="575" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">DATA</text>
  <text x="1100" y="593" text-anchor="middle" font-size="12" font-weight="700" fill="#f8fafc">BOUNDARY</text>
  <line x1="1072" y1="608" x2="1128" y2="608" stroke="#64748b"/>
  <text x="1100" y="632" text-anchor="middle" font-size="9" fill="#cbd5e1">SQLite FTS5</text>
  <text x="1100" y="650" text-anchor="middle" font-size="9" fill="#cbd5e1">Vault files</text>
  <text x="1100" y="668" text-anchor="middle" font-size="9" fill="#cbd5e1">Receipts</text>
  <text x="1100" y="686" text-anchor="middle" font-size="9" fill="#cbd5e1">Config YAML</text>

  <!-- Arrows -->
  <path class="line" d="M600 172 L600 223"/>
  <path class="line" d="M330 352 L378 352"/>
  <path class="line" d="M820 352 L868 352"/>
  <path class="line" d="M500 395 L407 543"/>
  <path class="line" d="M700 395 L792 543"/>
  <path class="dash" d="M145 630 L178 630"/>
  <path class="dash" d="M1022 630 L1053 630"/>
  <path class="dash" d="M192 480 L192 520 Q192 535 210 545"/>
  <path class="dash" d="M1007 480 L1007 520 Q1007 535 990 545"/>

  <!-- Bottom contract -->
  <rect x="55" y="765" width="1090" height="58" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="788" text-anchor="middle" class="section">Runtime Contract</text>
  <text x="600" y="810" text-anchor="middle" class="small">All external work flows through governance, capability checks, durable receipts, and operator-visible controls. Subsystems are configurable at runtime so the same agent can run lightweight developer tasks or stricter enterprise workflows.</text>
</svg>
