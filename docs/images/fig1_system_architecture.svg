<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Lancelot System Architecture</title>
  <desc id="desc">A current-state architecture diagram showing operator entry points, gateway orchestration, governance controls, model routing, execution providers, and evidence systems.</desc>

  <defs>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 760; }
      .subtitle { font-size: 13px; fill: #667085; }
      .band-title { font-size: 13px; font-weight: 760; letter-spacing: .08em; text-transform: uppercase; fill: #344054; }
      .box-title { font-size: 14px; font-weight: 760; fill: #101828; }
      .small { font-size: 11px; fill: #475467; }
      .tiny { font-size: 10px; fill: #667085; }
      .label { font-size: 10px; font-weight: 700; fill: #344054; }
      .pill { font-size: 10px; font-weight: 700; fill: #344054; }
      .outer { fill: #f8fafc; stroke: #d0d5dd; stroke-width: 1.2; }
      .surface { fill: #eef4ff; stroke: #84adff; }
      .runtime { fill: #f0fdf4; stroke: #86efac; }
      .governance { fill: #fff7ed; stroke: #fdba74; }
      .model { fill: #f5f3ff; stroke: #c4b5fd; }
      .execution { fill: #ecfeff; stroke: #67e8f9; }
      .evidence { fill: #fef2f2; stroke: #fca5a5; }
      .feature { fill: #ffffff; stroke: #cbd5e1; stroke-dasharray: 6 5; }
      .arrow { stroke: #475467; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #98a2b3; stroke-width: 1.5; fill: none; marker-end: url(#soft-arrow); }
      .receipt-arrow { stroke: #dc2626; stroke-width: 1.6; fill: none; marker-end: url(#receipt-arrow); stroke-dasharray: 5 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475467"/>
    </marker>
    <marker id="soft-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#98a2b3"/>
    </marker>
    <marker id="receipt-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" class="title">Lancelot System Architecture</text>
  <text x="600" y="66" text-anchor="middle" class="subtitle">Governed agent runtime with policy gates, approvals, scoped execution, and immutable receipts</text>

  <rect x="34" y="92" width="1132" height="672" rx="18" class="outer"/>

  <text x="70" y="126" class="band-title">Operator Surfaces</text>
  <rect x="58" y="144" width="185" height="84" rx="10" class="surface" filter="url(#shadow)"/>
  <text x="150" y="171" text-anchor="middle" class="box-title">War Room</text>
  <text x="150" y="192" text-anchor="middle" class="small">Command Center</text>
  <text x="150" y="208" text-anchor="middle" class="small">Receipts, Trust, Health</text>

  <rect x="58" y="244" width="185" height="84" rx="10" class="surface" filter="url(#shadow)"/>
  <text x="150" y="271" text-anchor="middle" class="box-title">APIs and Ingress</text>
  <text x="150" y="292" text-anchor="middle" class="small">REST, WebSocket</text>
  <text x="150" y="308" text-anchor="middle" class="small">CLI, Telegram, Scheduler</text>

  <text x="315" y="126" class="band-title">Runtime Boundary</text>
  <rect x="290" y="144" width="210" height="84" rx="10" class="runtime" filter="url(#shadow)"/>
  <text x="395" y="171" text-anchor="middle" class="box-title">Gateway</text>
  <text x="395" y="192" text-anchor="middle" class="small">Auth, rate limits, input gates</text>
  <text x="395" y="208" text-anchor="middle" class="small">Health and readiness</text>

  <rect x="290" y="244" width="210" height="84" rx="10" class="runtime" filter="url(#shadow)"/>
  <text x="395" y="271" text-anchor="middle" class="box-title">Orchestrator</text>
  <text x="395" y="292" text-anchor="middle" class="small">Intent, plans, tool loop</text>
  <text x="395" y="308" text-anchor="middle" class="small">Async work ledger</text>

  <rect x="290" y="344" width="210" height="84" rx="10" class="runtime" filter="url(#shadow)"/>
  <text x="395" y="371" text-anchor="middle" class="box-title">Response Governor</text>
  <text x="395" y="392" text-anchor="middle" class="small">Output gate</text>
  <text x="395" y="408" text-anchor="middle" class="small">Progress honesty checks</text>

  <text x="560" y="126" class="band-title">Governance Control Plane</text>
  <rect x="530" y="144" width="250" height="128" rx="10" class="governance" filter="url(#shadow)"/>
  <text x="655" y="171" text-anchor="middle" class="box-title">Policy Decision Stack</text>
  <text x="655" y="195" text-anchor="middle" class="small">Soul constraints and overlays</text>
  <text x="655" y="212" text-anchor="middle" class="small">Risk tiers T0-T3</text>
  <text x="655" y="229" text-anchor="middle" class="small">Approvals and ActionCards</text>
  <text x="655" y="246" text-anchor="middle" class="small">Kill switches and network allowlist</text>

  <rect x="530" y="294" width="250" height="84" rx="10" class="governance" filter="url(#shadow)"/>
  <text x="655" y="321" text-anchor="middle" class="box-title">Trust and Capability State</text>
  <text x="655" y="342" text-anchor="middle" class="small">Trust Ledger graduation</text>
  <text x="655" y="358" text-anchor="middle" class="small">Capability ceilings and revocation</text>

  <rect x="530" y="400" width="250" height="84" rx="10" class="governance" filter="url(#shadow)"/>
  <text x="655" y="427" text-anchor="middle" class="box-title">Frontier Privacy Boundary</text>
  <text x="655" y="448" text-anchor="middle" class="small">Deterministic PII pre-scrub</text>
  <text x="655" y="464" text-anchor="middle" class="small">Local verifier before egress</text>

  <text x="842" y="126" class="band-title">Model and Execution Planes</text>
  <rect x="820" y="144" width="145" height="84" rx="10" class="model" filter="url(#shadow)"/>
  <text x="892" y="171" text-anchor="middle" class="box-title">Model Router</text>
  <text x="892" y="192" text-anchor="middle" class="small">Local utility</text>
  <text x="892" y="208" text-anchor="middle" class="small">Fast and deep lanes</text>

  <rect x="982" y="144" width="145" height="84" rx="10" class="model" filter="url(#shadow)"/>
  <text x="1054" y="171" text-anchor="middle" class="box-title">Model Providers</text>
  <text x="1054" y="192" text-anchor="middle" class="small">Local LLM roles</text>
  <text x="1054" y="208" text-anchor="middle" class="small">Frontier SDK/API</text>

  <rect x="820" y="260" width="145" height="92" rx="10" class="execution" filter="url(#shadow)"/>
  <text x="892" y="287" text-anchor="middle" class="box-title">Tools</text>
  <text x="892" y="309" text-anchor="middle" class="small">Command runner</text>
  <text x="892" y="325" text-anchor="middle" class="small">File ops, skills</text>

  <rect x="982" y="260" width="145" height="92" rx="10" class="execution" filter="url(#shadow)"/>
  <text x="1054" y="287" text-anchor="middle" class="box-title">Connectors</text>
  <text x="1054" y="309" text-anchor="middle" class="small">Email, Slack, REST</text>
  <text x="1054" y="325" text-anchor="middle" class="small">Vault-backed credentials</text>

  <rect x="820" y="384" width="145" height="92" rx="10" class="execution" filter="url(#shadow)"/>
  <text x="892" y="411" text-anchor="middle" class="box-title">UAB</text>
  <text x="892" y="433" text-anchor="middle" class="small">Desktop control</text>
  <text x="892" y="449" text-anchor="middle" class="small">Route fallback and risk</text>

  <rect x="982" y="384" width="145" height="92" rx="10" class="feature" filter="url(#shadow)"/>
  <text x="1054" y="411" text-anchor="middle" class="box-title">Feature-Gated</text>
  <text x="1054" y="433" text-anchor="middle" class="small">HIVE, A2A, MCP</text>
  <text x="1054" y="449" text-anchor="middle" class="small">Federation, Time Travel</text>

  <text x="70" y="536" class="band-title">Evidence and Operations Plane</text>
  <rect x="58" y="556" width="206" height="94" rx="10" class="evidence" filter="url(#shadow)"/>
  <text x="161" y="584" text-anchor="middle" class="box-title">Receipts</text>
  <text x="161" y="606" text-anchor="middle" class="small">SQLite integrity chain</text>
  <text x="161" y="622" text-anchor="middle" class="small">Tamper detection</text>
  <text x="161" y="638" text-anchor="middle" class="small">Lineage and replay proof</text>

  <rect x="292" y="556" width="206" height="94" rx="10" class="evidence" filter="url(#shadow)"/>
  <text x="395" y="584" text-anchor="middle" class="box-title">Observability</text>
  <text x="395" y="606" text-anchor="middle" class="small">Health, readiness, events</text>
  <text x="395" y="622" text-anchor="middle" class="small">OTel spans and metrics</text>
  <text x="395" y="638" text-anchor="middle" class="small">Incident runbooks</text>

  <rect x="526" y="556" width="206" height="94" rx="10" class="evidence" filter="url(#shadow)"/>
  <text x="629" y="584" text-anchor="middle" class="box-title">Compliance Exports</text>
  <text x="629" y="606" text-anchor="middle" class="small">Audit bundles</text>
  <text x="629" y="622" text-anchor="middle" class="small">Chain verification</text>
  <text x="629" y="638" text-anchor="middle" class="small">Redacted reports</text>

  <rect x="760" y="556" width="170" height="94" rx="10" class="evidence" filter="url(#shadow)"/>
  <text x="845" y="584" text-anchor="middle" class="box-title">Runtime Data</text>
  <text x="845" y="606" text-anchor="middle" class="small">Memory and context</text>
  <text x="845" y="622" text-anchor="middle" class="small">ActionCards</text>
  <text x="845" y="638" text-anchor="middle" class="small">Work state</text>

  <rect x="958" y="556" width="170" height="94" rx="10" class="evidence" filter="url(#shadow)"/>
  <text x="1043" y="584" text-anchor="middle" class="box-title">Operator Review</text>
  <text x="1043" y="606" text-anchor="middle" class="small">Pending approvals</text>
  <text x="1043" y="622" text-anchor="middle" class="small">Trust proposals</text>
  <text x="1043" y="638" text-anchor="middle" class="small">Kill-switch actions</text>

  <rect x="58" y="688" width="1070" height="44" rx="10" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="593" y="715" text-anchor="middle" class="small">Default posture: local-first, source-available, feature-gated subsystems, and auditable execution before broad autonomy.</text>

  <path d="M243 186 H289" class="arrow"/>
  <path d="M243 286 H289" class="arrow"/>
  <path d="M395 228 V243" class="arrow"/>
  <path d="M395 328 V343" class="arrow"/>
  <path d="M500 286 H529" class="arrow"/>
  <path d="M500 386 C520 386 520 238 529 238" class="soft-arrow"/>
  <path d="M780 205 H819" class="arrow"/>
  <path d="M965 186 H981" class="arrow"/>
  <path d="M780 336 C800 336 800 306 819 306" class="arrow"/>
  <path d="M780 336 C800 336 800 430 819 430" class="arrow"/>
  <path d="M965 306 H981" class="arrow"/>
  <path d="M965 430 H981" class="arrow"/>
  <path d="M892 228 V259" class="soft-arrow"/>
  <path d="M1054 228 V259" class="soft-arrow"/>
  <path d="M655 484 V540 C655 548 645 548 629 555" class="receipt-arrow"/>
  <path d="M395 428 V540 C395 548 380 548 395 555" class="receipt-arrow"/>
  <path d="M892 476 V520 C892 540 850 540 845 555" class="receipt-arrow"/>
  <path d="M1054 476 V520 C1054 540 1043 540 1043 555" class="receipt-arrow"/>
  <path d="M161 556 C161 514 260 502 351 430" class="soft-arrow"/>
  <path d="M1043 556 C1043 520 1043 500 1043 476" class="soft-arrow"/>

  <rect x="78" y="736" width="12" height="12" rx="2" class="governance"/>
  <text x="96" y="746" class="tiny">Governance decisions are on the critical path before execution.</text>
  <rect x="396" y="736" width="12" height="12" rx="2" class="evidence"/>
  <text x="414" y="746" class="tiny">Receipt arrows indicate evidence written from runtime and execution paths.</text>
  <rect x="760" y="736" width="12" height="12" rx="2" class="feature"/>
  <text x="778" y="746" class="tiny">Dashed boxes are feature-gated or deployment-dependent subsystems.</text>
</svg>
