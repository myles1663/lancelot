[project]
name = "lancelot"
version = "0.4.1"
description = "Autonomous AI governance platform"
license = "BUSL-1.1"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "fastapi",
    "uvicorn",
    "watchdog",
    "streamlit>=1.56.0",
    "google-api-python-client",
    "google-auth",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pywebview",
    "cryptography>=46.0.7",
    "bcrypt>=4.0.0",
    "pyyaml>=6.0",
    "requests>=2.33.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.26",
    "playwright",
    "browser-use>=0.11.0",
    "authlib>=1.6.11",
    "langchain-google-genai",
    "langchain-openai>=1.1.14",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=1.2.28",
    "langsmith>=0.7.31",
    "pygments>=2.20.0",
    "pyjwt>=2.12.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "python-pptx>=0.6.21",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=0.41b0",
    "grpcio>=1.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-timeout",
]

[tool.uv]
# Lancelot is not an installable package — just install dependencies
package = false
