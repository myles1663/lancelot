_playbook_metadata:
  name: compliance-deprovisioned-session
  display_name: "Deprovisioned Operator Session Activity"
  description: "Response protocol when a session is invalidated due to a deprovisioned operator whose IdP refresh failed. Investigates whether governance actions occurred in the gap between IdP deprovisioning and Lancelot session invalidation."
  category: COMPLIANCE_EVENT
  severity_default: HIGH
  industry: general
  version: "1.0"
  author: Lancelot
  tags: [compliance, session, deprovisioning, idp, access-revocation]

trigger:
  receipt_types: [SESSION_INVALIDATED]
  conditions:
    - field: reason
      operator: eq
      value: REFRESH_FAILED
    - field: cause
      operator: eq
      value: OPERATOR_DEPROVISIONED
  severity: HIGH

paging:
  HIGH:
    - channel: slack
      endpoint_ref: vault://slack-incident-channel
      escalation_minutes: 15
  CRITICAL:
    - channel: pagerduty
      endpoint_ref: vault://pagerduty-webhook
      escalation_minutes: 5

steps:
  - step: 1
    title: "Identify the deprovisioned operator"
    description: "Extract operator_id, session_id, and invalidation timestamp from the triggering SESSION_INVALIDATED receipt. Pull the operator profile and determine when the IdP deprovisioning event occurred. Record the IdP deprovisioning timestamp and the Lancelot session invalidation timestamp."
    action_type: AUTOMATED
    sla_minutes: 3
    decision_points:
      - condition: "If operator_id cannot be resolved"
        action: "Escalate immediately — orphaned session with no operator identity is a security concern. Page security on-call."
      - condition: "If operator_id resolves successfully"
        action: "Record operator identity and proceed to Step 2."
    actions:
      - extract_field: operator_id
      - extract_field: session_id
      - extract_field: invalidation_timestamp

  - step: 2
    title: "Verify operator access is fully revoked"
    description: "Confirm that all active sessions for this operator_id have been invalidated, not just the triggering session. Check for any other active tokens, API keys, or delegated access grants associated with this operator. Verify the operator cannot authenticate through any channel."
    action_type: MANUAL
    sla_minutes: 10
    decision_points:
      - condition: "If other active sessions or tokens exist for this operator"
        action: "Immediately invalidate all remaining sessions and tokens. Record each invalidation as a receipt. Do not proceed until full revocation is confirmed."
      - condition: "If all access is confirmed revoked"
        action: "Proceed to Step 3."
    actions:
      - query_sessions:
          operator_id: "{{ operator_id }}"
          status: active

  - step: 3
    title: "Determine the access gap window"
    description: "Calculate the time delta between the IdP deprovisioning event and the Lancelot session invalidation. This is the window during which the deprovisioned operator may have continued to operate within Lancelot with valid cached credentials."
    action_type: AUTOMATED
    sla_minutes: 5
    decision_points:
      - condition: "If gap window is zero or negative (Lancelot invalidated before or simultaneously with IdP)"
        action: "No exposure window. Document the finding and skip to Step 7."
      - condition: "If gap window is under 5 minutes"
        action: "Low-risk window. Proceed to Step 4 for receipt review."
      - condition: "If gap window exceeds 5 minutes"
        action: "Significant exposure window. Proceed to Step 4 and flag for compliance escalation."
    actions:
      - compute_gap: true

  - step: 4
    title: "Pull all receipts from the gap window"
    description: "Query every receipt generated by this operator_id between the IdP deprovisioning timestamp and the Lancelot session invalidation timestamp. Include all receipt types: governance actions, quest executions, approval decisions, kill switch operations, compliance exports, Soul amendments, and any API calls."
    action_type: AUTOMATED
    sla_minutes: 5
    decision_points:
      - condition: "If no receipts exist in the gap window"
        action: "No post-deprovisioning activity. Document and proceed to Step 7."
      - condition: "If receipts exist in the gap window"
        action: "Flag all receipts for review. Proceed to Step 5."
    actions:
      - query_receipts:
          operator_id: "{{ operator_id }}"
          start: "{{ idp_deprovisioning_timestamp }}"
          end: "{{ invalidation_timestamp }}"

  - step: 5
    title: "Classify gap-window actions by severity"
    description: "Review each receipt from the gap window and classify it. Read-only actions (viewing dashboards, reading receipts) are low-risk. Governance actions (approvals, Soul amendments, kill switch changes, compliance exports) are high-risk. Any action that modified system state or granted permissions during the gap window must be individually documented."
    action_type: MANUAL
    sla_minutes: 15
    decision_points:
      - condition: "If only read-only actions occurred during the gap"
        action: "Document the read-only actions. Proceed to Step 7."
      - condition: "If governance or state-modifying actions occurred during the gap"
        action: "Escalate to CRITICAL. Proceed to Step 6 immediately."
    actions: []

  - step: 6
    title: "Escalate to compliance and HR"
    description: "Governance actions taken by a deprovisioned operator represent a compliance event that may require regulatory disclosure. Notify the compliance officer and HR immediately. Provide the full list of governance receipts from the gap window. Determine whether any approvals or permissions granted during the gap need to be reversed. If Soul amendments were made, review and potentially revert them."
    action_type: MANUAL
    sla_minutes: 10
    decision_points:
      - condition: "If gap-window actions can be safely reversed"
        action: "Execute reversals through governed channels to generate audit receipts. Document each reversal."
      - condition: "If gap-window actions cannot be reversed (e.g., data was exported or shared externally)"
        action: "Invoke data breach response protocol. Notify legal. Do not close this incident without legal sign-off."
    actions:
      - notify: compliance-officer
      - notify: hr-contact
      - escalate_severity: CRITICAL

  - step: 7
    title: "Root cause and remediation"
    description: "Document the root cause of the gap between IdP deprovisioning and Lancelot session invalidation. Was the refresh interval too long? Was there a polling delay? Should real-time SCIM push be configured? Recommend configuration changes to reduce or eliminate the gap window in future deprovisioning events."
    action_type: MANUAL
    sla_minutes: 30
    decision_points:
      - condition: "If gap was caused by refresh interval configuration"
        action: "Recommend reducing token refresh interval. Document the recommended value."
      - condition: "If gap was caused by infrastructure delay or outage"
        action: "Document the infrastructure issue. Open a separate remediation ticket."
      - condition: "If real-time SCIM is not configured"
        action: "Recommend enabling SCIM push for immediate deprovisioning propagation."
    actions: []

  - step: 8
    title: "Close incident"
    description: "Verify all remediation actions are complete and receipted. Confirm operator access remains fully revoked. If governance actions occurred in the gap window, confirm compliance and HR have been notified and have acknowledged. Write root_cause summary. For incidents escalated to CRITICAL, legal sign-off is required before close."
    action_type: MANUAL
    sla_minutes: 10
    decision_points:
      - condition: "If all reviews complete and no gap-window governance actions"
        action: "Close incident with standard documentation."
      - condition: "If gap-window governance actions occurred and all reversals and notifications are confirmed"
        action: "Close incident with compliance sign-off."
      - condition: "If any review or reversal is incomplete"
        action: "Return to the appropriate step. Do not close until all items are resolved."
    actions:
      - create_report: post_incident
      - close_incident: true
