_playbook_metadata:
  name: security-event-credential-anomaly
  display_name: "Credential Anomaly Detected"
  description: "Responds to unexpected credential revocations outside maintenance windows and patterns of failed authentication attempts that may indicate credential compromise or operator error."
  category: SECURITY_EVENT
  severity_default: HIGH
  industry: general
  version: "1.0"
  author: Lancelot
  tags: [credentials, authentication, compromise, revocation, vault, security]

trigger:
  receipt_types: [CREDENTIAL_REVOKED, AUTH_FAILED]
  conditions:
    - field: context
      operator: not_in
      value: MAINTENANCE_WINDOW
    - field: failed_attempts
      operator: gte
      value: 3
  severity: HIGH

paging:
  CRITICAL:
    - channel: pagerduty
      endpoint_ref: vault://pagerduty-webhook
      escalation_minutes: 5
  HIGH:
    - channel: slack
      endpoint_ref: vault://slack-incident-channel
      escalation_minutes: 15

steps:
  - step: 1
    title: "Identify the credential and affected service"
    description: "Extract the credential identifier, the service or integration it authenticates, the vault path if applicable, and the operator or system that last accessed it. Determine whether the trigger was a revocation event or repeated authentication failures."
    action_type: AUTOMATED
    sla_minutes: 3
    decision_points:
      - condition: "If trigger is CREDENTIAL_REVOKED"
        action: "Record who or what revoked the credential, the revocation timestamp, and whether a maintenance window was active."
      - condition: "If trigger is AUTH_FAILED with multiple attempts"
        action: "Record the source IPs, user agents, and timestamps of all failed attempts. Check for velocity anomalies."
    actions:
      - extract_field: credential_id
      - extract_field: service_name
      - extract_field: vault_path
      - extract_field: last_accessed_by

  - step: 2
    title: "Determine if the credential is still active"
    description: "Check the current state of the credential in Vault and in the target service. If the credential was revoked but the service still accepts it (propagation delay), or if repeated auth failures suggest brute force against an active credential, immediate action is required."
    action_type: AUTOMATED
    sla_minutes: 2
    decision_points:
      - condition: "If credential is still active and auth failures are ongoing"
        action: "Revoke the credential immediately via Vault API. Do not wait for further investigation."
      - condition: "If credential is already revoked"
        action: "Verify revocation has propagated to the target service. Proceed to Step 3."
      - condition: "If credential status cannot be determined"
        action: "Treat as active and revoke as a precaution. Escalate to infrastructure team."
    actions:
      - check_vault_status: "{{ credential_id }}"
      - revoke_if_active: true

  - step: 3
    title: "Classify the anomaly as internal or external"
    description: "Determine whether the credential anomaly was caused by an internal operator action (accidental revocation, password rotation mistake, misconfigured service) or by an external threat (credential stuffing, stolen token, compromised API key). Review access logs, source IPs, and operator activity timelines."
    action_type: MANUAL
    sla_minutes: 15
    decision_points:
      - condition: "If anomaly is internal operator error"
        action: "Document the error. If credential was accidentally revoked, re-issue through standard Vault rotation. Proceed to Step 6 for documentation."
      - condition: "If anomaly appears to be external compromise"
        action: "Proceed immediately to Step 4 for full compromise response."
      - condition: "If classification is uncertain"
        action: "Treat as external compromise until proven otherwise. Proceed to Step 4."
    actions: []

  - step: 4
    title: "Check Network Allowlist for modifications"
    description: "Review the Network Allowlist configuration for any recent modifications that could indicate an attacker widening access. Check if new IPs or domains were added, if existing restrictions were loosened, or if allowlist kill switches were toggled. Cross-reference any allowlist changes with the credential anomaly timeline."
    action_type: MANUAL
    sla_minutes: 10
    decision_points:
      - condition: "If allowlist was modified near the time of the credential anomaly"
        action: "Revert allowlist changes immediately. Treat as coordinated attack — escalate severity to CRITICAL."
      - condition: "If allowlist is unchanged"
        action: "Proceed to Step 5. Credential compromise may be limited to the specific service."
      - condition: "If allowlist audit reveals pre-existing unauthorized entries"
        action: "Flag as separate incident. Invoke the allowlist-violation playbook. Continue this playbook in parallel."
    actions:
      - query_allowlist_audit_log: true

  - step: 5
    title: "Invoke legal and security for external compromise"
    description: "For confirmed or suspected external compromise: notify the security team lead, legal counsel, and compliance officer. Rotate all credentials that share the same access scope or were stored adjacently in Vault. Determine if the compromise triggers any regulatory notification obligations."
    action_type: MANUAL
    sla_minutes: 30
    decision_points:
      - condition: "If compromised credential had access to PII or regulated data"
        action: "Invoke compliance export for the affected time window. Begin breach notification timeline assessment with legal."
      - condition: "If compromised credential was limited to internal services"
        action: "Rotate affected credentials. Notify security team lead. No regulatory notification required unless data exfiltration is confirmed."
      - condition: "If multiple credentials from the same Vault path are affected"
        action: "Assume Vault path compromise. Rotate entire path. Audit Vault access policies for over-permissioning."
    actions:
      - notify: security-team-lead
      - notify: legal-oncall
      - rotate_credentials: same_scope

  - step: 6
    title: "Remediate and harden"
    description: "Apply remediations based on the root cause. For operator error: update runbooks and add guardrails to prevent recurrence. For external compromise: rotate all related credentials, tighten Vault access policies, and add the source IPs to the blocklist if applicable."
    action_type: MANUAL
    sla_minutes: 30
    decision_points:
      - condition: "If root cause was operator error"
        action: "Re-issue the credential through Vault. Add maintenance-window checks to the revocation workflow to prevent out-of-window revocations."
      - condition: "If root cause was external compromise"
        action: "Confirm all rotations are complete. Verify no lingering sessions use old credentials. Enable enhanced monitoring on affected services for 72 hours."
    actions: []

  - step: 7
    title: "Post-incident report and closure"
    description: "Document the full incident timeline: detection, classification, isolation, remediation, and any regulatory actions taken. Update credential management runbooks if gaps were identified. Close the incident only after all credential rotations are confirmed and monitoring is in place."
    action_type: MANUAL
    sla_minutes: 60
    decision_points:
      - condition: "If external compromise was confirmed"
        action: "Schedule a 7-day follow-up review to check for any delayed indicators of compromise. Keep enhanced monitoring active."
      - condition: "If internal error was confirmed"
        action: "Close with standard post-incident report. No follow-up review required unless pattern repeats."
    actions:
      - create_report: post_incident
      - close_incident: true
