_playbook_metadata:
  name: security-event-injection
  display_name: "Injection Attack Detected"
  description: "Responds to prompt injection or payload injection detected in MCP tool calls or inbound A2A messages. Immediate isolation required — do not wait to investigate before killing the source."
  category: SECURITY_EVENT
  severity_default: CRITICAL
  industry: general
  version: "1.0"
  author: Lancelot
  tags: [injection, mcp, a2a, prompt-injection, security, isolation]

trigger:
  receipt_types: [MCP_TOOL_BLOCKED, A2A_INBOUND_BLOCKED]
  conditions:
    - field: reason
      operator: eq
      value: INJECTION_DETECTED
  severity: CRITICAL

paging:
  CRITICAL:
    - channel: pagerduty
      endpoint_ref: vault://pagerduty-webhook
      escalation_minutes: 5
    - channel: slack
      endpoint_ref: vault://slack-security-critical
      escalation_minutes: 3

steps:
  - step: 1
    title: "Identify the injection source"
    description: "Determine whether the injection originated from an MCP server tool call or an inbound A2A agent message. Record the source identifier (MCP server name or A2A agent card URI), the blocked payload hash, and the timestamp from the triggering receipt."
    action_type: AUTOMATED
    sla_minutes: 2
    decision_points:
      - condition: "If source is an MCP server"
        action: "Record server name and tool that was invoked. Proceed to Step 2 with MCP isolation path."
      - condition: "If source is an A2A caller"
        action: "Record agent card URI and task ID. Proceed to Step 2 with A2A isolation path."
    actions:
      - extract_field: source_identifier
      - extract_field: blocked_payload_hash
      - extract_field: receipt_id

  - step: 2
    title: "Kill the source immediately"
    description: "Activate the per-server kill switch (for MCP) or per-agent kill switch (for A2A) to isolate the source. This step is mandatory and must not be deferred. Do not wait for investigation results before isolating."
    action_type: AUTOMATED
    sla_minutes: 1
    decision_points:
      - condition: "If MCP source"
        action: "Set kill switch mcp.servers.<server_name>.enabled = false via Kill Switch API."
      - condition: "If A2A source"
        action: "Set kill switch a2a.agents.<agent_id>.inbound_enabled = false via Kill Switch API."
      - condition: "If kill switch activation fails"
        action: "Immediately escalate to infrastructure on-call. Do not proceed without confirmed isolation."
    actions:
      - invoke_kill_switch: true
      - notify: security-oncall

  - step: 3
    title: "Confirm isolation is effective"
    description: "Verify that the kill switch is active and no further requests from the isolated source are being processed. Check the real-time receipt stream for any new receipts from the source after the kill switch was activated."
    action_type: AUTOMATED
    sla_minutes: 3
    decision_points:
      - condition: "If new requests are still arriving from the source"
        action: "Escalate immediately — kill switch may not be propagated. Check gateway routing and restart if necessary."
      - condition: "If isolation is confirmed"
        action: "Proceed to Step 4."
    actions:
      - verify_kill_switch: true
      - query_receipts_since: kill_switch_activation_time

  - step: 4
    title: "Pull 24-hour receipt history from the source"
    description: "Query all receipts generated by or related to the isolated source over the past 24 hours. This includes MCP_TOOL_EXECUTED, MCP_TOOL_BLOCKED, A2A_INBOUND_RECEIVED, A2A_INBOUND_BLOCKED, and any QUEST_EXECUTED receipts that reference tools or agents from the source."
    action_type: AUTOMATED
    sla_minutes: 5
    decision_points:
      - condition: "If receipts show successful executions before the block"
        action: "Flag all successful executions for forensic review. These may contain injected payloads that were not caught."
      - condition: "If no prior successful executions exist"
        action: "Source was blocked on first attempt. Still proceed with full review."
    actions:
      - query_receipts:
          source: "{{ source_identifier }}"
          lookback_hours: 24

  - step: 5
    title: "Analyze the injection payload"
    description: "Examine the blocked payload to classify the injection type: prompt injection, SQL injection, command injection, or serialization attack. Determine whether this is a known attack pattern or a novel vector. Record the classification in the incident record."
    action_type: MANUAL
    sla_minutes: 15
    decision_points:
      - condition: "If payload matches a known injection signature"
        action: "Cross-reference with threat intelligence. Check if other sources in the mesh may be using the same payload pattern."
      - condition: "If payload is a novel vector"
        action: "Document the pattern for addition to the injection detection ruleset. Flag for security research follow-up."
      - condition: "If payload appears to be a false positive"
        action: "Do NOT re-enable the source. Proceed to Step 8 for security team review before any re-enablement."
    actions: []

  - step: 6
    title: "Assess blast radius"
    description: "Determine whether the injection source had any successful interactions that may have compromised data or downstream systems. Check if any approved quests used outputs from the source. Check if any secrets or credentials were accessible to the source."
    action_type: MANUAL
    sla_minutes: 20
    decision_points:
      - condition: "If source had access to secrets or credentials"
        action: "Initiate credential rotation for all secrets the source could access. Invoke the credential-anomaly playbook as a linked incident."
      - condition: "If downstream quests consumed tainted output"
        action: "Identify all affected quests and flag their outputs as potentially compromised. Notify affected operators."
      - condition: "If no successful interactions occurred"
        action: "Blast radius is contained. Document and proceed to Step 7."
    actions: []

  - step: 7
    title: "Notify security team lead and stakeholders"
    description: "Escalate the incident to the security team lead with a full summary: source identity, injection type, isolation timestamp, blast radius assessment, and 24-hour receipt analysis. This escalation is mandatory for all injection events regardless of blast radius."
    action_type: AUTOMATED
    sla_minutes: 5
    decision_points:
      - condition: "If blast radius includes credential exposure"
        action: "Additionally notify the compliance officer and invoke the compliance export for this incident window."
      - condition: "If blast radius is contained"
        action: "Standard escalation to security team lead only."
    actions:
      - notify: security-team-lead
      - attach: incident_summary

  - step: 8
    title: "Security review and disposition"
    description: "Security team lead reviews the full incident package and makes the final disposition. The source must NOT be re-enabled without explicit security team approval. If the source is a third-party MCP server or external A2A agent, consider permanent revocation."
    action_type: MANUAL
    sla_minutes: 60
    decision_points:
      - condition: "If confirmed malicious"
        action: "Permanently revoke the source. Add to blocklist. If third-party, notify the vendor or operator of the external agent."
      - condition: "If confirmed false positive after security review"
        action: "Document the false positive pattern. Update detection rules to reduce future false positives. Re-enable the source with enhanced monitoring for 72 hours."
      - condition: "If inconclusive"
        action: "Keep the source isolated. Schedule a deeper forensic review within 24 hours. Do not re-enable until conclusive."
    actions: []

  - step: 9
    title: "Post-incident documentation and rule update"
    description: "Create a post-incident report documenting the timeline, injection vector, blast radius, and remediation actions. Update injection detection rules if a novel pattern was identified. Close the incident only after security team lead signs off."
    action_type: MANUAL
    sla_minutes: 120
    decision_points:
      - condition: "If novel injection pattern was found"
        action: "Submit detection rule update PR and confirm it is deployed before closing."
      - condition: "If existing rules caught the injection"
        action: "Document effectiveness and close with standard post-incident report."
    actions:
      - create_report: post_incident
      - close_incident: requires_security_signoff
