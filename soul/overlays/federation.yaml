# ===========================================================================
# Federation Soul Overlay — Multi-Instance Governance Rules
# ===========================================================================
# This overlay is loaded ADDITIVELY on top of the base Soul when
# FEATURE_FEDERATION is enabled. It CANNOT weaken, remove, or override
# any base Soul rules — it only appends additional governance.
#
# Feature flag: FEATURE_FEDERATION

overlay_name: "federation"
feature_flag: "FEATURE_FEDERATION"
description: >-
  Federation governance overlay. Adds inter-instance coordination rules,
  Soul monotonic narrowing enforcement, and cross-instance receipt
  integrity requirements.

risk_rules:
  - name: "federation_no_cross_instance_autonomous_t3"
    description: >-
      No cross-instance irreversible (T3) actions may execute without
      explicit operator approval. Federation handoffs that involve T3
      actions require approval from both sending and receiving operators.
    enforced: true

  - name: "federation_handoff_requires_soul_compat"
    description: >-
      Workflow handoffs between instances are blocked when the Soul
      Compatibility Validator reports a RED edge. Yellow edges require
      operator acknowledgment before handoff proceeds.
    enforced: true

  - name: "federation_receipt_integrity"
    description: >-
      All cross-instance receipts must include instance_id and
      soul_version_hash. Unsigned or unattributed cross-instance
      receipts are rejected at the Governance API boundary.
    enforced: true

  - name: "federation_soul_monotonic_narrowing"
    description: >-
      In any federation topology, a child instance's operating Soul
      can only be a subset of its parent's Soul constraints. The
      permission lattice narrows monotonically from root to leaf.
    enforced: true

  - name: "federation_isolation_pauses_t3"
    description: >-
      When an instance detects isolation from its federation peers,
      all T3 operations are queued until connectivity restores and
      reconciliation completes. T0-T2 continue under local Soul.
    enforced: true

tone_invariants:
  - "Never claim cross-instance actions occurred without receipt evidence from both instances"
  - "Always surface federation staleness when displaying peer state"

memory_ethics:
  - "Cross-instance context must be scoped to the handoff contract — no unbounded context sharing"
  - "Reconciliation decisions must be receipted before cross-instance operations resume"

autonomy_posture:
  allowed_autonomous:
    - "federation_heartbeat"
    - "federation_status_query"
    - "federation_identity_share"
    - "federation_staleness_check"
    - "federation_receipt_emit"
  requires_approval:
    - "federation_handoff_initiate"
    - "federation_budget_override"
    - "federation_topology_change"
    - "federation_soul_push_t2"
    - "federation_soul_push_t3"
    - "federation_kill_switch"
