name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_LLM_IMAGE_NAME: ${{ github.repository }}-local-llm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          file_version=$(cat VERSION | tr -d '[:space:]')
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "::error::VERSION file ($file_version) does not match tag ($tag_version)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push core Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push local model Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./local_models
          file: ./local_models/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            LOCAL_LLM_WHEEL_VARIANT=cpu
            LOCAL_LLM_WHEEL_VERSION=0.3.19
          tags: |
            ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:llama-cpp-0.3.19-cpu
            ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:${{ steps.version.outputs.version }}-llama-cpp-0.3.19-cpu
          cache-from: type=gha,scope=local-llm
          cache-to: type=gha,mode=max,scope=local-llm

      - name: Build and push CUDA local model Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./local_models
          file: ./local_models/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            LOCAL_LLM_WHEEL_VARIANT=cu123
            LOCAL_LLM_WHEEL_VERSION=0.3.19
          tags: |
            ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:llama-cpp-0.3.19-cu123
            ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:${{ steps.version.outputs.version }}-llama-cpp-0.3.19-cu123
          cache-from: type=gha,scope=local-llm-cuda
          cache-to: type=gha,mode=max,scope=local-llm-cuda

      - name: Build and push Prism local model Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./local_models
          file: ./local_models/Dockerfile.prism
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:prism-b8846-d104cf1
            ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:${{ steps.version.outputs.version }}-prism-b8846-d104cf1
          cache-from: type=gha,scope=local-llm-prism
          cache-to: type=gha,mode=max,scope=local-llm-prism

      - name: Build GitHub Release body
        run: |
          cat RELEASE_NOTES.md > release-body.md
          cat >> release-body.md <<'EOF'

          ## Docker

          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker pull ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:${{ steps.version.outputs.version }}-llama-cpp-0.3.19-cpu
          docker pull ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:${{ steps.version.outputs.version }}-llama-cpp-0.3.19-cu123
          docker pull ${{ env.REGISTRY }}/${{ env.LOCAL_LLM_IMAGE_NAME }}:${{ steps.version.outputs.version }}-prism-b8846-d104cf1
          ```

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the concise public changelog.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: release-body.md
