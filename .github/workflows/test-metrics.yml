name: Test Metrics

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - docs/test-metrics.json

permissions:
  contents: write

concurrency:
  group: test-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish test metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install UAB dependencies
        working-directory: packages/uab
        run: npm ci

      - name: Install installer dependencies
        working-directory: installer
        run: npm ci

      - name: Prepare runtime data directories
        run: |
          sudo mkdir -p /home/lancelot/data /home/lancelot/workspace
          sudo chown -R "$USER:$USER" /home/lancelot

      - name: Collect metrics
        run: python scripts/collect-test-metrics.py --output docs/test-metrics.json

      - name: Commit metrics
        run: |
          if git diff --quiet -- docs/test-metrics.json; then
            echo "No metrics changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-metrics.json
          git commit -m "Update Lancelot test metrics [skip ci]"
          git push
