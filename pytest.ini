[pytest]
testpaths = tests
markers =
    integration: marks tests requiring live services (skipped without env vars)
    slow: marks tests that are slow running
    docker: marks tests requiring Docker runtime
    local_model: marks tests requiring local model weights + llama-cpp-python
    legacy: marks archived prompt-era regression suites that are kept for reference outside the default testpaths
addopts = -v --tb=short --durations=50 -m "not integration and not slow and not docker and not local_model"
timeout = 30
